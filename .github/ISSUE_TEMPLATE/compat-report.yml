name: 兼容测试报告 ｜ Compatibility Report
description: 提交你测试过的 APK / EXE 在 Mac 应用宝上的运行情况 ｜ Report how an APK / EXE runs on Mac App Bao
title: "[兼容] 软件名 - 运行状态 ｜ App Name - Status"
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        🇨🇳 感谢分享！填得越细，兼容清单越有用。
        🇬🇧 Thanks! The more detail you fill in, the more useful the list gets.

  - type: dropdown
    id: type
    attributes:
      label: 软件类型 ｜ App Type
      options:
        - APK（安卓应用 ｜ Android）
        - EXE（Windows 程序）
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: 软件名称 ｜ App Name
      placeholder: "例 ｜ e.g. 微信 / WeChat、原神 / Genshin、植物大战僵尸 / PvZ"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 软件版本 ｜ App Version
      placeholder: "例 ｜ e.g. 8.0.50 / latest"
    validations:
      required: false

  - type: dropdown
    id: chip_family
    attributes:
      label: 芯片系列 ｜ Chip Family
      options:
        - M1
        - M2
        - M3
        - M4
    validations:
      required: true

  - type: dropdown
    id: chip_variant
    attributes:
      label: 芯片后缀 ｜ Chip Variant
      description: 没有就选 标准版 ｜ Pick 标准版 if none
      options:
        - 标准版 ｜ Standard
        - Pro
        - Max
        - Pro Max
        - 其他 ｜ Other (please specify in notes)
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: 机型 ｜ Model
      options:
        - Mac mini
        - MacBook Air
        - MacBook Pro
        - iMac
        - Mac Studio
        - Mac Pro
        - 其他 ｜ Other (please specify in notes)
    validations:
      required: true

  - type: dropdown
    id: memory
    attributes:
      label: 内存 ｜ Memory
      options:
        - 8G
        - 16G
        - 24G
        - 32G
        - ">= 48G"
        - ">= 64G"
        - 其他 ｜ Other (please specify in notes)
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本 ｜ macOS Version
      placeholder: "例 ｜ e.g. 15.2"
    validations:
      required: true

  - type: input
    id: yyb_version
    attributes:
      label: Mac 应用宝版本 ｜ Mac App Bao Version
      placeholder: "在关于页面查看 ｜ See About page, e.g. 0.7.9"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: 运行状态 ｜ Status
      options:
        - "✅ 完美运行 ｜ Works perfectly"
        - "🔶 能跑但有小问题 ｜ Runs with minor issues"
        - "❌ 跑不了 ｜ Doesn't run"
    validations:
      required: true

  - type: textarea
    id: perf
    attributes:
      label: 性能 / 画质 / 帧率（可选）｜ Performance / Quality / FPS (optional)
      placeholder: "例 ｜ e.g. 中画质 50 帧，内存占用 6G ｜ Medium ~50fps, ~6G RAM"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 补充说明 ｜ Notes
      placeholder: "闪退点、报错信息、和 Crossover / Parallels 的对比、是否触发账号风控等 ｜ Crash points, errors, comparison with Crossover/Parallels, account risk, etc."
    validations:
      required: false
