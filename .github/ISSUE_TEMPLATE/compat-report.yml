name: 兼容测试报告
description: 提交你测试过的 APK / EXE 在 Mac 应用宝上的运行情况
title: "[兼容] 软件名 - 运行状态"
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        感谢分享！填得越细，兼容清单越有用。
        比如“M2 Pro 16G 能跑 / M1 8G 闪退”这种信息非常值钱。

  - type: dropdown
    id: type
    attributes:
      label: 软件类型
      options:
        - APK（安卓应用）
        - EXE（Windows 程序）
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: 软件名称
      placeholder: 例：微信 / WeChat、原神、植物大战僵尸
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 软件版本
      placeholder: 例：8.0.50 / 最新版
    validations:
      required: false

  - type: dropdown
    id: chip_family
    attributes:
      label: 芯片系列
      options:
        - M1
        - M2
        - M3
        - M4
    validations:
      required: true

  - type: dropdown
    id: chip_variant
    attributes:
      label: 芯片后缀
      description: 没有就选 标准版
      options:
        - 标准版
        - Pro
        - Max
        - Pro Max
        - 其他（评论里说明）
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: 机型
      options:
        - Mac mini
        - MacBook Air
        - MacBook Pro
        - iMac
        - Mac Studio
        - Mac Pro
        - 其他（评论里说明）
    validations:
      required: true

  - type: dropdown
    id: memory
    attributes:
      label: 内存
      options:
        - 8G
        - 16G
        - 24G
        - 32G
        - ">= 48G"
        - ">= 64G"
        - 其他（评论里说明）
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例：15.2
    validations:
      required: true

  - type: input
    id: yyb_version
    attributes:
      label: Mac 应用宝版本
      placeholder: 在关于页面查看，例：0.7.9
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: 运行状态
      options:
        - "✅ 完美运行"
        - "🔶 能跑但有小问题"
        - "❌ 跑不了"
    validations:
      required: true

  - type: textarea
    id: perf
    attributes:
      label: 性能 / 画质 / 帧率（可选）
      placeholder: 例：中画质 50 帧，内存占用 6G；或“启动 10 秒，偶尔卡顿”
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      placeholder: 闪退点、报错信息、和 Crossover / Parallels 的对比、是否触发账号风控等
    validations:
      required: false
